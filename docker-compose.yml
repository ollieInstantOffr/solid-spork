version: "3.9"

services:
  luna:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luna-cycle-tracker
    env_file:
      - .env
    ports:
      - "6666:3000"
    volumes:
      # Persist the SQLite database
      - luna-db:/app/data
    environment:
      DATABASE_URL: "file:/app/data/luna.db"
      NODE_ENV: "production"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/auth/session"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  luna-db:
    driver: local
